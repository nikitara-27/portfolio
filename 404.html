<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Niki Taradash</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side rewrite, so it serves this file for
      // any URL that isn't a real static file — e.g. a direct link or
      // refresh on /about. This encodes the real path into a query string
      // and redirects to the site root, where the script in index.html
      // decodes it back before React Router ever sees it.
      //
      // pathSegmentsToKeep: 0 — served from the custom domain
      // (nikitaradash.com) at the root, not a GitHub Pages project-site
      // subpath, so there's no leading repo-name segment to preserve.
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
